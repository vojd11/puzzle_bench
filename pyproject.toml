[project]
name = "zebra-bench"
version = "0.1.0"
description = "Zebra-puzzle logic-reasoning benchmark for LLMs, with an interactive dashboard and a local runner UI."
readme = "README.md"
requires-python = ">=3.9"

# The benchmark, the runner web UI, and the interactive dashboard are pure
# standard library — there is nothing to install to run them:
#   python bench.py ... | python serve.py | python report.py results.jsonl
dependencies = []

[project.optional-dependencies]
# Only the static PNG charts need matplotlib:  pip/uv install ".[plots]"
plots = ["matplotlib>=3.5"]

[tool.uv]
# This is a collection of runnable scripts, not an installable package, so uv
# should lock the environment without trying to build/install the project.
package = false
